// Download Router Support - AutoConfig bootstrap
try {
  const root = Services.dirsvc.get("GreD", Ci.nsIFile);
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("download-router-support", Services.io.newFileURI(root));
  const observer = {observe() {
    Services.obs.removeObserver(observer, "browser-delayed-startup-finished");
    try { ChromeUtils.importESModule("resource://download-router-support/download-router-sync.sys.mjs").start(); }
    catch (error) { Components.utils.reportError(error); }
    try { ChromeUtils.importESModule("resource://download-router-support/download-router-actions.sys.mjs").start(); }
    catch (error) { Components.utils.reportError(error); }
  }};
  Services.obs.addObserver(observer,"browser-delayed-startup-finished");
} catch (error) { Components.utils.reportError(error); }
