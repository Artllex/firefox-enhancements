// Firefox ZIP Quick Extract v0.1.10 - privileged AutoConfig script
try {
  (function () {
    var BUTTON_CLASS = "zipQuickExtractButton";
    var DELETE_BUTTON_CLASS = "downloadQuickDeleteButton";
    var INIT_ATTR = "zip-quick-extract-initialized";
    var HELPER_NAME = "zip_quick_extract.ps1";
    var TITLE = "Rozpakuj ZIP";
    var MAIN_HISTORY_BUTTON_ID = "appMenu-history-button";
    var RESTORE_SESSION_BUTTON_ID = "appMenu-restoreSession";
    var CLEAR_HISTORY_BUTTON_ID = "appMenuClearRecentHistory";
    var SECRET_HELPER_NAME = "firefox_secret_window.ps1";
    var SECRET_LAUNCHER_NAME = "firefox_secret_window.vbs";
    var secretHelperStarted = false;
    var secretMediaGuardStarted = false;
    var secretMediaGuardHidden = false;
    var secretMediaMuteState = new Map();

    function isSecretProfile() {
      try {
        return Services.dirsvc.get("ProfD", Ci.nsIFile).leafName === "FirefoxSecretProfile";
      } catch (_) {
        return false;
      }
    }

    function getSecretProfileMarker(name) {
      var file = Services.dirsvc.get("ProfD", Ci.nsIFile).clone();
      file.append(name);
      return file;
    }

    function touchFile(file) {
      try {
        if (!file.exists()) {
          file.create(Ci.nsIFile.NORMAL_FILE_TYPE, 384);
        }
      } catch (error) {
        reportError(error);
      }
    }

    function removeFileIfExists(file) {
      try {
        if (file.exists()) {
          file.remove(false);
        }
      } catch (_) {}
    }

    function setSecretProfileAudioMuted(shouldMute) {
      try {
        var windows = Services.wm.getEnumerator("navigator:browser");
        while (windows.hasMoreElements()) {
          var browserWin = windows.getNext();
          if (!browserWin || !browserWin.gBrowser) {
            continue;
          }
          var tabs = browserWin.gBrowser.tabs;
          for (var i = 0; i < tabs.length; i++) {
            var tab = tabs[i];
            if (shouldMute) {
              if (!secretMediaMuteState.has(tab)) {
                secretMediaMuteState.set(tab, !!tab.muted);
              }
              if (!tab.muted && typeof tab.toggleMuteAudio === "function") {
                tab.toggleMuteAudio();
              }
            } else if (secretMediaMuteState.has(tab)) {
              var wasMuted = secretMediaMuteState.get(tab);
              if (!wasMuted && tab.muted && typeof tab.toggleMuteAudio === "function") {
                tab.toggleMuteAudio();
              }
              secretMediaMuteState.delete(tab);
            }
          }
        }
      } catch (error) {
        reportError(error);
      }
    }

    function ensureSecretProfileMediaGuard(win) {
      try {
        if (!isSecretProfile() || secretMediaGuardStarted) {
          return;
        }
        secretMediaGuardStarted = true;

        var requestFile = getSecretProfileMarker(".secret-window-hidden");
        var ackFile = getSecretProfileMarker(".secret-window-hidden-ack");

        var timer = win.setInterval(function () {
          try {
            var requested = requestFile.exists();
            if (requested) {
              // Re-run while requested so any additional browser window/tab is also muted.
              setSecretProfileAudioMuted(true);
              secretMediaGuardHidden = true;
              touchFile(ackFile);
            } else if (secretMediaGuardHidden) {
              setSecretProfileAudioMuted(false);
              secretMediaGuardHidden = false;
              removeFileIfExists(ackFile);
            }
          } catch (error) {
            reportError(error);
          }
        }, 40);

        win.addEventListener(
          "unload",
          function () {
            try { win.clearInterval(timer); } catch (_) {}
          },
          { once: true }
        );
      } catch (error) {
        reportError(error);
      }
    }

    function getSecretHelperFile() {
      var file = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
      file.append(SECRET_HELPER_NAME);
      return file;
    }

    function getSecretLauncherFile() {
      var file = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
      file.append(SECRET_LAUNCHER_NAME);
      return file;
    }

    function getFirefoxExeFile() {
      try {
        return Services.dirsvc.get("XREExeF", Ci.nsIFile).clone();
      } catch (_) {
        var file = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
        file.append("firefox.exe");
        return file;
      }
    }

    function getFirefoxProcessId() {
      try {
        return Services.appinfo.processID;
      } catch (_) {
        try {
          return Services.appinfo.QueryInterface(Ci.nsIXULRuntime).processID;
        } catch (_) {
          return 0;
        }
      }
    }

    function launchSecretHelperMode(mode) {
      try {
        var helper = getSecretHelperFile();
        var launcher = getSecretLauncherFile();
        var firefoxExe = getFirefoxExeFile();
        var wscript = getWScriptFile();
        var pid = getFirefoxProcessId();

        if (!pid || !helper.exists() || !launcher.exists() || !firefoxExe.exists() || !wscript.exists()) {
          reportError("Secret window helper files are missing or PID is unavailable.");
          return false;
        }

        var process = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
        process.init(wscript);
        var args = [
          "//B",
          "//Nologo",
          launcher.path,
          helper.path,
          String(pid),
          firefoxExe.path,
          mode
        ];
        process.runwAsync(args, args.length, { observe: function () {} }, false);
        return true;
      } catch (error) {
        reportError(error);
        return false;
      }
    }

    function ensureSecretHelperStarted() {
      if (secretHelperStarted) {
        return;
      }
      if (launchSecretHelperMode("listen")) {
        secretHelperStarted = true;
      }
    }

    function getAppMenuNode(win, id) {
      try {
        var doc = win.document;
        var node = doc.getElementById(id);
        if (node) {
          return node;
        }
        var cache = doc.getElementById("appMenu-viewCache");
        if (cache && cache.content) {
          return cache.content.querySelector("#" + id);
        }
      } catch (error) {
        reportError(error);
      }
      return null;
    }

    function removeFollowingSeparator(node) {
      try {
        if (!node) {
          return;
        }
        var next = node.nextSibling;
        while (next && next.nodeType !== 1) {
          next = next.nextSibling;
        }
        if (next && next.localName === "toolbarseparator" && next.parentNode) {
          next.parentNode.removeChild(next);
        }
      } catch (error) {
        reportError(error);
      }
    }

    function moveHistoryActionsToMainMenu(win) {
      try {
        var historyButton = getAppMenuNode(win, MAIN_HISTORY_BUTTON_ID);
        var restoreButton = getAppMenuNode(win, RESTORE_SESSION_BUTTON_ID);
        var clearButton = getAppMenuNode(win, CLEAR_HISTORY_BUTTON_ID);

        if (!historyButton || !restoreButton || !clearButton || !historyButton.parentNode) {
          return false;
        }

        var mainBody = historyButton.parentNode;

        // If already moved, keep the native buttons exactly under History.
        if (
          restoreButton.parentNode === mainBody &&
          clearButton.parentNode === mainBody &&
          restoreButton.previousSibling === historyButton
        ) {
          return true;
        }

        // In the native History subview each of these buttons is followed by a
        // separator. Remove those separators before moving the native nodes,
        // otherwise the History subview would be left with two empty dividers.
        if (restoreButton.parentNode !== mainBody) {
          removeFollowingSeparator(restoreButton);
        }
        if (clearButton.parentNode !== mainBody) {
          removeFollowingSeparator(clearButton);
        }

        var anchor = historyButton.nextSibling;
        mainBody.insertBefore(restoreButton, anchor);
        mainBody.insertBefore(clearButton, anchor);

        restoreButton.setAttribute("firefox-quick-tools-main-menu", "true");
        clearButton.setAttribute("firefox-quick-tools-main-menu", "true");

        return true;
      } catch (error) {
        reportError(error);
        return false;
      }
    }

    function initMainMenuHistoryActions(win) {
      try {
        if (moveHistoryActionsToMainMenu(win)) {
          return;
        }

        var observer = new win.MutationObserver(function () {
          if (moveHistoryActionsToMainMenu(win)) {
            try {
              observer.disconnect();
            } catch (_) {}
          }
        });
        observer.observe(win.document.documentElement, {
          childList: true,
          subtree: true
        });

        win.addEventListener(
          "unload",
          function () {
            try {
              observer.disconnect();
            } catch (_) {}
          },
          { once: true }
        );
      } catch (error) {
        reportError(error);
      }
    }

    function reportError(error) {
      try {
        Components.utils.reportError("Firefox ZIP Quick Extract: " + error);
      } catch (_) {}
    }

    function localFile(path) {
      var file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      file.initWithPath(path);
      return file;
    }

    function getHelperFile() {
      var file = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
      file.append(HELPER_NAME);
      return file;
    }

    function getWScriptFile() {
      var file = Services.dirsvc.get("SysD", Ci.nsIFile).clone();
      file.append("wscript.exe");
      return file;
    }

    function getLauncherFile() {
      var file = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
      file.append("zip_quick_extract.vbs");
      return file;
    }

    function getDownload(item) {
      try {
        return item && item._shell ? item._shell.download : null;
      } catch (_) {
        return null;
      }
    }

    function getArchivePath(item) {
      var download = getDownload(item);
      return download && download.target ? download.target.path || "" : "";
    }

    function isZipReady(item) {
      var download = getDownload(item);
      var path = download && download.target ? download.target.path || "" : "";
      return !!(download && download.succeeded && /\.zip$/i.test(path));
    }

    function getNativeActionButton(item) {
      var children = item.children;
      for (var i = 0; i < children.length; i++) {
        var child = children[i];
        if (
          child.classList &&
          child.classList.contains("downloadButton") &&
          !child.classList.contains(BUTTON_CLASS) &&
          !child.classList.contains(DELETE_BUTTON_CLASS)
        ) {
          return child;
        }
      }
      return null;
    }

    function getOurButton(item) {
      var children = item.children;
      for (var i = 0; i < children.length; i++) {
        var child = children[i];
        if (child.classList && child.classList.contains(BUTTON_CLASS)) {
          return child;
        }
      }
      return null;
    }

    function getDeleteButton(item) {
      var children = item.children;
      for (var i = 0; i < children.length; i++) {
        var child = children[i];
        if (child.classList && child.classList.contains(DELETE_BUTTON_CLASS)) {
          return child;
        }
      }
      return null;
    }

    function isDeleteReady(item) {
      try {
        var download = getDownload(item);
        return !!(
          download &&
          download.succeeded &&
          download.stopped &&
          !download.deleted &&
          download.target &&
          download.target.path &&
          download.target.exists
        );
      } catch (_) {
        return false;
      }
    }

    function setButtonState(button, state) {
      button.removeAttribute("zip-qe-running");
      button.removeAttribute("zip-qe-success");
      button.removeAttribute("zip-qe-error");
      button.disabled = false;

      if (state === "running") {
        button.setAttribute("zip-qe-running", "true");
        button.disabled = true;
        button.setAttribute("tooltiptext", "Rozpakowywanie...");
        return;
      }
      if (state === "success") {
        button.setAttribute("zip-qe-success", "true");
        button.setAttribute("tooltiptext", "Gotowe - folder otwarto i skopiowano do schowka");
        return;
      }
      if (state === "error") {
        button.setAttribute("zip-qe-error", "true");
        button.setAttribute("tooltiptext", "Nie udalo sie rozpakowac ZIP-a");
        return;
      }
      button.setAttribute(
        "tooltiptext",
        "Rozpakuj, otworz folder i skopiuj go do schowka"
      );
    }

    function updateButton(item, button) {
      try {
        button.hidden = !isZipReady(item);
      } catch (error) {
        reportError(error);
      }
    }

    function updateDeleteButton(item, button) {
      try {
        button.hidden = !isDeleteReady(item);
        button.disabled = false;
        button.setAttribute("tooltiptext", "Usuń pobrany plik");
      } catch (error) {
        reportError(error);
      }
    }

    function deleteDownloadedFile(win, item, button) {
      try {
        var download = getDownload(item);
        var path = download && download.target ? download.target.path || "" : "";
        if (!download || !path || !isDeleteReady(item)) {
          updateDeleteButton(item, button);
          return;
        }

        var file = localFile(path);
        var ok = Services.prompt.confirm(
          win,
          "Usuń pobrany plik",
          "Usunąć ten plik z dysku?\n\n" + file.leafName +
            "\n\nTa operacja używa natywnej funkcji Firefoxa i usuwa plik trwale."
        );
        if (!ok) {
          return;
        }

        var shell = item && item._shell ? item._shell : null;
        if (!shell || typeof shell.downloadsCmd_deleteFile !== "function") {
          showAlert(win, "Firefox nie udostępnił funkcji usuwania dla tego pobrania.");
          return;
        }

        button.disabled = true;
        button.setAttribute("tooltiptext", "Usuwanie...");

        Promise.resolve(shell.downloadsCmd_deleteFile()).then(
          function () {
            win.setTimeout(function () {
              try {
                if (button.isConnected) {
                  updateDeleteButton(item, button);
                }
                var extractButton = getOurButton(item);
                if (extractButton && extractButton.isConnected) {
                  updateButton(item, extractButton);
                }
              } catch (error) {
                reportError(error);
              }
            }, 0);
          },
          function (error) {
            reportError(error);
            button.disabled = false;
            button.setAttribute("tooltiptext", "Usuń pobrany plik");
            showAlert(win, "Nie udało się usunąć pliku:\n" + error);
          }
        );
      } catch (error) {
        reportError(error);
        button.disabled = false;
        showAlert(win, "Błąd podczas usuwania pliku:\n" + error);
      }
    }

    function stopItemEvent(event) {
      event.stopPropagation();
    }

    function showAlert(win, message) {
      try {
        Services.prompt.alert(win, TITLE, message);
      } catch (error) {
        reportError(error);
      }
    }

    function extractZip(win, item, button) {
      try {
        var archivePath = getArchivePath(item);
        if (!archivePath || !/\.zip$/i.test(archivePath)) {
          return;
        }

        var archive = localFile(archivePath);
        if (!archive.exists() || !archive.isFile()) {
          showAlert(win, "Plik ZIP nie istnieje juz w lokalizacji pobierania.");
          updateButton(item, button);
          return;
        }

        var destination = archive.parent.clone();
        destination.append(archive.leafName.replace(/\.zip$/i, ""));

        if (destination.exists()) {
          var ok = Services.prompt.confirm(
            win,
            TITLE,
            "Folder juz istnieje:\n\n" + destination.path +
              "\n\nRozpakowac do niego i nadpisac pliki o tych samych nazwach?"
          );
          if (!ok) {
            return;
          }
        }

        var helper = getHelperFile();
        if (!helper.exists() || !helper.isFile()) {
          showAlert(
            win,
            "Brak pliku pomocniczego:\n" + helper.path +
              "\n\nUruchom ponownie instalator."
          );
          return;
        }

        var launcher = getLauncherFile();
        if (!launcher.exists() || !launcher.isFile()) {
          showAlert(
            win,
            "Brak ukrytego launchera:\n" + launcher.path +
              "\n\nUruchom ponownie instalator."
          );
          return;
        }

        var wscript = getWScriptFile();
        if (!wscript.exists() || !wscript.isFile()) {
          showAlert(win, "Nie znaleziono Windows Script Host (wscript.exe).");
          return;
        }

        setButtonState(button, "running");

        var process = Cc["@mozilla.org/process/util;1"].createInstance(Ci.nsIProcess);
        process.init(wscript);

        // wscript.exe has no console window. The VBS launcher starts PowerShell
        // with window style 0 and waits for its exit code, so the entire
        // extraction runs silently in the background without a PowerShell flash.
        var args = [
          "//B",
          "//Nologo",
          launcher.path,
          helper.path,
          archive.path
        ];

        var observer = {
          observe: function (subject, topic) {
            try {
              var exitCode = -1;
              try {
                exitCode = subject.QueryInterface(Ci.nsIProcess).exitValue;
              } catch (_) {}

              if (topic === "process-finished" && exitCode === 0) {
                setButtonState(button, "success");
                win.setTimeout(function () {
                  if (button.isConnected) {
                    setButtonState(button, "idle");
                    updateButton(item, button);
                  }
                }, 2500);
                return;
              }

              setButtonState(button, "error");
              showAlert(
                win,
                "Nie udalo sie rozpakowac archiwum.\nKod zakonczenia: " + exitCode +
                  "\n\nSzczegoly: %TEMP%\\FirefoxZipQuickExtract_last_error.txt"
              );
              win.setTimeout(function () {
                if (button.isConnected) {
                  setButtonState(button, "idle");
                  updateButton(item, button);
                }
              }, 4000);
            } catch (error) {
              reportError(error);
            }
          }
        };

        process.runwAsync(args, args.length, observer, false);
      } catch (error) {
        reportError(error);
        setButtonState(button, "error");
        showAlert(win, "Blad podczas uruchamiania rozpakowywania:\n" + error);
        win.setTimeout(function () {
          if (button.isConnected) {
            setButtonState(button, "idle");
          }
        }, 4000);
      }
    }

    function decorateItem(win, item) {
      try {
        if (!item || item.localName !== "richlistitem") {
          return;
        }

        var nativeButton = getNativeActionButton(item);
        if (!nativeButton) {
          return;
        }

        var button = getOurButton(item);
        if (!button) {
          button = win.document.createXULElement("button");
          button.className = "downloadButton " + BUTTON_CLASS;
          button.setAttribute("aria-label", "Rozpakuj archiwum ZIP");
          setButtonState(button, "idle");

          ["click", "mousedown", "mouseup", "mouseover", "mouseout"].forEach(function (type) {
            button.addEventListener(type, stopItemEvent);
          });

          button.addEventListener("command", function (event) {
            event.stopPropagation();
            extractZip(win, item, button);
          });

          item.insertBefore(button, nativeButton);
        }

        var deleteButton = getDeleteButton(item);
        if (!deleteButton) {
          deleteButton = win.document.createXULElement("button");
          deleteButton.className = "downloadButton " + DELETE_BUTTON_CLASS;
          deleteButton.setAttribute("aria-label", "Usuń pobrany plik");
          deleteButton.setAttribute("tooltiptext", "Usuń pobrany plik");

          ["click", "mousedown", "mouseup", "mouseover", "mouseout"].forEach(function (type) {
            deleteButton.addEventListener(type, stopItemEvent);
          });

          deleteButton.addEventListener("command", function (event) {
            event.stopPropagation();
            deleteDownloadedFile(win, item, deleteButton);
          });

          item.insertBefore(deleteButton, button);
        }

        updateButton(item, button);
        updateDeleteButton(item, deleteButton);
      } catch (error) {
        reportError(error);
      }
    }

    function decorateAll(win, list) {
      try {
        var items = list.querySelectorAll("richlistitem");
        for (var i = 0; i < items.length; i++) {
          decorateItem(win, items[i]);
        }
      } catch (error) {
        reportError(error);
      }
    }

    function injectStyle(win) {
      try {
        if (win.document.getElementById("zip-quick-extract-style")) {
          return;
        }
        var style = win.document.createElementNS(
          "http://www.w3.org/1999/xhtml",
          "style"
        );
        style.id = "zip-quick-extract-style";
        style.textContent =
          "." + BUTTON_CLASS + " {" +
          "  list-style-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.25%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M3.25%206.25%201%202.75M12.75%206.25%2015%202.75%22%2F%3E%3Crect%20x%3D%223.25%22%20y%3D%226.25%22%20width%3D%229.5%22%20height%3D%226.75%22%20rx%3D%22.35%22%2F%3E%3Cpath%20d%3D%22M10.25%2011.5h1%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E') !important;" +
          "  -moz-context-properties: fill, fill-opacity;" +
          "  fill: currentColor;" +
          "}" +
          "." + BUTTON_CLASS + "[zip-qe-running='true'] { opacity: 0.55 !important; }" +
          "." + BUTTON_CLASS + "[zip-qe-success='true'] {" +
          "  list-style-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath fill=%22%23fff%22 d=%22M6.4 12.4 2.5 8.5l1.4-1.4 2.5 2.5 5.7-5.7 1.4 1.4z%22/%3E%3C/svg%3E') !important;" +
          "}" +
          "." + BUTTON_CLASS + "[zip-qe-error='true'] {" +
          "  list-style-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath fill=%22%23fff%22 d=%22M7 2h2v8H7zm0 10h2v2H7z%22/%3E%3C/svg%3E') !important;" +
          "}" +
          "." + DELETE_BUTTON_CLASS + " {" +
          "  list-style-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath fill=%22%23fff%22 d=%22M5 1h6l1 2h3v2H1V3h3l1-2zm-1 5h8l-.7 9H4.7L4 6zm2 1v6h1V7H6zm3 0v6h1V7H9z%22/%3E%3C/svg%3E') !important;" +
          "  -moz-context-properties: fill, fill-opacity;" +
          "  fill: currentColor;" +
          "}";
        win.document.documentElement.appendChild(style);
      } catch (error) {
        reportError(error);
      }
    }

    function attachToDownloadsList(win, list) {
      try {
        if (!list || list.hasAttribute(INIT_ATTR)) {
          return true;
        }
        list.setAttribute(INIT_ATTR, "true");
        injectStyle(win);
        decorateAll(win, list);

        var scheduled = false;
        var refresh = function () {
          if (scheduled) {
            return;
          }
          scheduled = true;
          win.setTimeout(function () {
            scheduled = false;
            if (!win.closed && list.isConnected) {
              decorateAll(win, list);
            }
          }, 0);
        };

        var observer = new win.MutationObserver(refresh);
        observer.observe(list, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["state", "exists", "active", "hidden"]
        });

        win.addEventListener(
          "unload",
          function () {
            try {
              observer.disconnect();
            } catch (_) {}
          },
          { once: true }
        );
        return true;
      } catch (error) {
        reportError(error);
        return false;
      }
    }

    function initWindow(win) {
      try {
        if (!win || win.closed || !win.document) {
          return;
        }

        // The Secret profile only runs the media guard. It must never start the
        // global hotkey helper itself; otherwise a helper spawned from the Secret
        // process tree could be frozen together with that profile.
        ensureSecretProfileMediaGuard(win);
        if (!isSecretProfile()) {
          ensureSecretHelperStarted();
        }

        // Independent of the downloads panel: move the two native History
        // actions into the main Firefox application menu, directly below
        // the native History entry. The Secret-window menu button was removed
        // in v0.1.7; Ctrl+Alt+Space is the only toggle.
        initMainMenuHistoryActions(win);

        var tryAttach = function () {
          try {
            var list = win.document.getElementById("downloadsListBox");
            return list ? attachToDownloadsList(win, list) : false;
          } catch (error) {
            reportError(error);
            return false;
          }
        };

        if (tryAttach()) {
          return;
        }

        var docObserver = new win.MutationObserver(function () {
          if (tryAttach()) {
            try {
              docObserver.disconnect();
            } catch (_) {}
          }
        });
        docObserver.observe(win.document.documentElement, {
          childList: true,
          subtree: true
        });

        win.addEventListener(
          "unload",
          function () {
            try {
              docObserver.disconnect();
            } catch (_) {}
          },
          { once: true }
        );
      } catch (error) {
        reportError(error);
      }
    }

    var startupObserver = {
      observe: function (subject, topic) {
        if (topic !== "browser-delayed-startup-finished") {
          return;
        }
        try {
          // One shared startup for download actions and location synchronization.
          // Keep synchronization failure independent of all existing UI features.
          try {
            var directory = Services.dirsvc.get("GreD", Ci.nsIFile).clone();
            Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
              .setSubstitution("zipquickextract", Services.io.newFileURI(directory));
            ChromeUtils.importESModule("resource://zipquickextract/download-location-sync.sys.mjs").start();
          } catch (syncError) { reportError(syncError); }
          var win = subject;
          win.setTimeout(function () {
            initWindow(win);
          }, 0);
        } catch (error) {
          reportError(error);
        }
      }
    };

    Services.obs.addObserver(startupObserver, "browser-delayed-startup-finished");
  })();
} catch (error) {
  try {
    Components.utils.reportError("Firefox ZIP Quick Extract startup error: " + error);
  } catch (_) {}
}
